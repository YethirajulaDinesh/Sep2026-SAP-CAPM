_schema-version: "3.3.0"
ID: poapplication
description: Welcome to your new CAP project.
version: 1.0.0

modules:
  - name: poapplication-srv
    type: nodejs
    path: srv
    requires:
      - name: poapplication-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: poapplication-db-deployer
    type: hdb
    path: db
    requires:
      - name: poapplication-db
    parameters:
      buildpack: nodejs_buildpack

  - name: poapplication-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: poapplication-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - project3.zip
          name: project3
          target-path: resources/

  - name: project3
    type: html5
    path: app/project3
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: poapplication-srv-gen
    type: nodejs
    path: gen/srv
    requires:
      - name: poapplication-auth

resources:
  - name: poapplication-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: poapplication-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: poapplication-html5-service
      service-plan: app-host

  - name: poapplication-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: poapplication-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
            existing_destinations_policy: update
        version: 1.0.0

  - name: poapplication-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: poapplication-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production